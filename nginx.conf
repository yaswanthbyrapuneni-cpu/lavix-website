server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Videos are large (intro.mp4 ~144MB). sendfile + byte-range support lets the
    # browser start playback from the first chunk instead of buffering the whole
    # file, and disabling buffering keeps memory flat while streaming.
    sendfile on;
    tcp_nopush on;
    # nginx already sets Accept-Ranges for static files — don't duplicate it.
    location ~* \.(mp4|webm|mov)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA fallback — this site is client-routed, so unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    # Deliberately NOT gzipping mp4 — already compressed, wastes CPU.
}
